name: Deploy Certification

on:
  workflow_run:
    workflows: ["CI Staging"]
    branches: [staging]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: deploy-certification
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to Certification
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment: certification
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      - name: Deploy (placeholder)
        env:
          DEPLOY_TOKEN: ${{ secrets.CERT_DEPLOY_TOKEN }}
        run: |
          echo "Desplegando commit ${{ github.sha }} a Certification"
          if [ -z "$DEPLOY_TOKEN" ]; then
            echo "::warning::CERT_DEPLOY_TOKEN no configurado. Simulando despliegue."
          else
            echo "Token presente. Aquí iría el deploy real a certificación."
          fi
          echo "status=deployed-cert" >> "$GITHUB_STEP_SUMMARY"
